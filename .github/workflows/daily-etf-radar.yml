
name: Daily ETF Buy Radar

on:
  schedule:
    - cron: '27 15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: etf-buy-radar-daily
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Update ETF rankings
        env:
          TZ: Asia/Taipei
        run: python run_daily.py

      - name: Save daily history
        run: |
          git config user.name "ETF Radar Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/
          if ! git diff --cached --quiet; then
            git commit -m "ETF radar daily refresh"
            git push
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: etf-radar-result
          path: site/
          retention-days: 7

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}

    steps:
      - name: Publish website
        id: publish
        uses: actions/deploy-pages@v4

